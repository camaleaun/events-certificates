# On a version tag (X.Y.Z, or X.Y.Z-rc.N for a pre-release): builds what git ignores (build/, build-signer/,
# build-blocks/, assets/css, assets/js), makes the release zip with bin/package.sh and attaches it to a GitHub
# release whose text is the version's Changelog entry. A tag with a suffix is a GitHub pre-release only.
# The zip of a final is what is uploaded to WordPress.org.
name: Release

on:
  push:
    tags: [ '[0-9]+.[0-9]+*' ]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag, the plugin header and the readme agree
        run: |
          version="$(sed -n 's/^ \* Version: *//p' events-certificates.php | head -1)"
          stable="$(sed -n 's/^Stable tag: *//p' readme.txt | head -1)"
          echo "tag=${GITHUB_REF_NAME} header=${version} readme=${stable}"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag and the Version header must be the same."
            exit 1
          fi
          # A final also moves Stable tag; a pre-release leaves it on the last final.
          case "$version" in
            *-*) ;;
            *) [ "$stable" = "$version" ] || { echo "::error::The Stable tag must be the version of a final release."; exit 1; } ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The third-party PHP libraries are made from the runtime packages (docs/decisions/0032). The PHP that makes them
      # is not the one that runs them: the tests job runs the build on 7.4, here a current one makes the zip.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # setup-php's wp-cli tool downloads wp-cli.phar from the release, whose file is named wp-cli-<version>.phar since 2.12.
      - name: WP-CLI
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo install -m 755 /tmp/wp-cli.phar /usr/local/bin/wp

      - name: Build and package
        run: |
          composer install --no-dev --no-interaction --prefer-dist
          npm ci
          bash bin/package.sh "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v4
        with:
          name: events-certificates-zip
          path: ${{ runner.temp }}/release/*.zip
          if-no-files-found: error

      - name: The release text is the version's Changelog entry
        run: |
          final="${GITHUB_REF_NAME%%-*}"
          awk -v heading="= $final =" '
            /^== Changelog ==/ { in_changelog = 1; next }
            /^== / { in_changelog = 0 }
            in_changelog && $0 == heading { found = 1; next }
            in_changelog && /^= / { found = 0 }
            in_changelog && found && NF { print }
          ' readme.txt > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::readme.txt has no Changelog entry for $final."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_file="$(ls "$RUNNER_TEMP"/release/*.zip)"
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags=(--prerelease --latest=false) ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip_file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip_file" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" ${flags[@]+"${flags[@]}"}
          fi

      # WordPress Playground fetches the blueprint's zip from the browser, and a release asset has no CORS headers (github.com redirects to
      # release-assets.githubusercontent.com, which sends none), while a file of a branch on raw.githubusercontent.com has them. So the zip of a
      # final release is copied, as it is, to the `playground` branch (a README and the zip, one commit each time, nothing else): the blueprint
      # (.wordpress-org/blueprints/blueprint.json) installs it from there, and the demo never runs an older build than the release.
      - name: The release zip for the Playground demo
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          zip_file="$(ls "$RUNNER_TEMP"/release/*.zip)"
          dir="$RUNNER_TEMP/playground"
          mkdir -p "$dir"
          git fetch origin playground
          git show origin/playground:README.md > "$dir/README.md"
          cp "$zip_file" "$dir/events-certificates.zip"
          cd "$dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md events-certificates.zip
          git commit -q -m "Playground build of $GITHUB_REF_NAME"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/playground

